name: 'Upsert a sticky PR comment'
description: >
  Create-or-update a single PR issue comment identified by a hidden HTML marker,
  so re-runs replace the previous body instead of adding new comments. Used for
  the gcc build summary and the clang-tidy summary (the two "unify as one sticky
  comment" payloads). Trusted stage-2 only: the caller must already have
  established a validated pr-number via the pr-context action.

inputs:
  github-token:
    description: 'Token with pull-requests:write.'
    required: true
  repository:
    description: 'github.repository — owner/name of the base repo.'
    required: true
  pr-number:
    description: 'Validated PR number (from pr-context).'
    required: true
  marker:
    description: 'Stable id for this comment slot, e.g. "build-summary" or "clang-tidy". One sticky comment per marker.'
    required: true
  body-file:
    description: 'Path to a file holding the Markdown body to post.'
    required: true
  bot-login:
    description: 'Login of the identity that owns our comments (for the ownership match). Change this if you switch to a GitHub App token.'
    required: false
    default: 'github-actions[bot]'
  recreate:
    description: >
      'true' = delete the previous comment and repost, so the single sticky comment always lands
      at the bottom of the PR timeline (and fires a fresh notification!). Edit-in-place results
      in the comment staying at its original position, which quickly disappears out of sight on most PRs.
      'false' = do edit in place (stable permalink, no notification, but can get
      buried). If the token cannot delete the comment it emits a ::warning:: and falls back to
      edit-in-place (deletion needs issues: write on the calling workflow's token).
    required: false
    default: 'true'
  retire-markers:
    description: >
      Optional space-separated list of OLD marker names this slot supersedes. Any bot
      comment carrying "<!-- onewifi-ci:<name> -->" for a retired marker is deleted
      (non-fatal), so renaming/folding a sticky does not orphan its previous comments.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Upsert sticky comment (${{ inputs.marker }})
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        PR: ${{ inputs.pr-number }}
        MARKER: ${{ inputs.marker }}
        BODY_FILE: ${{ inputs.body-file }}
        BOT_LOGIN: ${{ inputs.bot-login }}
        RECREATE: ${{ inputs.recreate }}
        RETIRE_MARKERS: ${{ inputs.retire-markers }}
      run: |
        set -uo pipefail
        if [ ! -f "$BODY_FILE" ]; then
          echo "::error::body-file '$BODY_FILE' not found."
          exit 1
        fi
        # Hidden marker: lets the next run find our comment for this slot without
        # relying on any actor field that crossed the trust boundary.
        TAG="<!-- onewifi-ci:${MARKER} -->"
        # The marker is always the FIRST line, and ownership checks below require it there
        # (startswith, not contains): the body embeds untrusted build output, so a PR could
        # otherwise plant another slot's marker and get that slot to delete this comment.
        { printf '%s\n\n' "$TAG"; cat "$BODY_FILE"; } > sticky-body.md

        # Cap the body. GitHub rejects issue comments over ~65536 bytes, and the
        # POST/PATCH would fail after everything else succeeded. Truncate with a
        # note. if the cut lands inside a ``` code fence, close it first so the
        # note isn't swallowed into the block.
        MAXB=60000
        if [ "$(wc -c < sticky-body.md)" -gt "$MAXB" ]; then
          # iconv -c drops any invalid/incomplete UTF-8 the byte-cut may leave
          # (the summaries contain emoji) so the JSON body stays valid.
          head -c "$MAXB" sticky-body.md | iconv -f utf-8 -t utf-8 -c > sticky-body.cut
          mv sticky-body.cut sticky-body.md
          if [ $(( $(grep -c '```' sticky-body.md) % 2 )) -ne 0 ]; then
            printf '\n```\n' >> sticky-body.md
          fi
          printf '\n\n_… truncated at %s bytes; see workflow run summary for full output._\n' "$MAXB" >> sticky-body.md
        fi

        # Find EVERY comment we own for this marker (not just the first). "Ours" =
        # the bot identity (login + type == Bot) AND our marker. Collecting ALL ids
        # lets a re-run reconcile duplicates a prior concurrent run may have left (the
        # old P4 recreate race): recreate deletes them all and posts one; edit patches
        # the first and deletes the rest. $BOT_LOGIN and $TAG are workflow-trusted (not
        # fork data), so interpolating them into the jq filter is safe.
        # A failed lookup must NOT read as "no comments yet" (that would POST a duplicate):
        # warn and skip this run instead; the next run reconciles. Never red the job.
        if ! ids_out="$(gh api "/repos/$REPO/issues/$PR/comments" --paginate \
             --jq ".[] | select(.user.type == \"Bot\" and .user.login == \"$BOT_LOGIN\") | select(.body | startswith(\"$TAG\")) | .id" \
             2>/tmp/sticky_err)"; then
          echo "::warning::Could not list comments on PR #$PR; not posting sticky '$MARKER' this run (avoids a duplicate)."
          cat /tmp/sticky_err
          exit 0
        fi
        IDS=()
        [ -n "$ids_out" ] && readarray -t IDS <<< "$ids_out"

        # Non-fatal single-comment delete that tolerates a 404 (already gone).
        del() {
          if gh api --method DELETE "/repos/$REPO/issues/comments/$1" >/dev/null 2>/tmp/sticky_err; then
            return 0
          fi
          grep -q 'HTTP 404' /tmp/sticky_err && return 0
          echo "::warning::Could not delete $2 comment $1 (continuing)."
          cat /tmp/sticky_err
          return 1
        }

        # Retire superseded markers: when a slot is renamed or folded (e.g. build-summary
        # + clang-tidy -> ci-summary), delete their old comments so they do not linger.
        if [ -n "$RETIRE_MARKERS" ]; then
          read -ra RETIRE <<< "$RETIRE_MARKERS"
          for rm in "${RETIRE[@]}"; do
            rtag="<!-- onewifi-ci:${rm} -->"
            gh api "/repos/$REPO/issues/$PR/comments" --paginate \
              --jq ".[] | select(.user.type == \"Bot\" and .user.login == \"$BOT_LOGIN\") | select(.body | startswith(\"$rtag\")) | .id" \
              2>/dev/null | while read -r rid; do
                [ -n "$rid" ] || continue
                del "$rid" "retired '$rm'" && echo "Retired old '$rm' comment $rid."
              done
          done
        fi

        # -f (raw-field) sends the body as a plain string — no gh type-inference, no
        # dependence on the '@file' loader. Bodies are small (capped upstream).
        body="$(cat sticky-body.md)"

        if [ "$RECREATE" = "true" ] && [ "${#IDS[@]}" -gt 0 ]; then
          # Recreate: delete every existing copy, then POST one fresh so the sticky lands
          # at the bottom of the timeline (fresh notification). Deleting ALL — not just the
          # first — self-heals a duplicate left by a prior concurrent run. If any copy can
          # NOT be deleted (403/5xx; a 404 counts as gone), do not POST a second one: fall
          # back to editing the surviving copy in place, as edit mode would.
          left=()
          for id in "${IDS[@]}"; do del "$id" "sticky '$MARKER'" || left+=("$id"); done
          if [ "${#left[@]}" -gt 0 ]; then
            echo "::warning::Could not delete ${#left[@]} '$MARKER' comment(s); editing in place instead of posting a duplicate."
            IDS=("${left[@]}")
            RECREATE=false
          fi
        fi

        if [ "$RECREATE" = "true" ]; then
          if gh api --method POST "/repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
            echo "Posted sticky '$MARKER' on PR #$PR (recreate; removed ${#IDS[@]} prior copy/copies)."
          else
            echo "::error::Failed to create sticky '$MARKER' comment."
            exit 1
          fi
        elif [ "${#IDS[@]}" -eq 0 ]; then
          # Edit mode, first run: nothing to edit -> create.
          if gh api --method POST "/repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
            echo "Created sticky '$MARKER' comment on PR #$PR."
          else
            echo "::error::Failed to create sticky '$MARKER' comment."
            exit 1
          fi
        else
          # Edit mode: PATCH the first copy in place, then delete any extras (dedup). A 404
          # on the PATCH means it vanished since the lookup -> POST a fresh one instead.
          first="${IDS[0]}"
          if gh api --method PATCH "/repos/$REPO/issues/comments/$first" -f body="$body" >/dev/null 2>/tmp/sticky_err; then
            echo "Updated sticky '$MARKER' comment ($first) on PR #$PR."
          elif grep -q 'HTTP 404' /tmp/sticky_err; then
            echo "::warning::Sticky '$MARKER' comment $first vanished; creating a fresh one."
            if ! gh api --method POST "/repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null; then
              echo "::error::Failed to create sticky '$MARKER' comment."
              exit 1
            fi
          else
            echo "::error::Failed to update sticky '$MARKER' comment $first."
            cat /tmp/sticky_err
            exit 1
          fi
          if [ "${#IDS[@]}" -gt 1 ]; then
            for id in "${IDS[@]:1}"; do del "$id" "duplicate sticky '$MARKER'"; done
          fi
        fi
        # A non-fatal cleanup delete must never set this step's exit code.
        exit 0
