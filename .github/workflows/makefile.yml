name: Build Check

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stage 1 is deliberately read-only: it builds PR-controlled makefiles, so it
# must hold no write scope. The PR-comment posting (writes) happens only in the
# trusted workflow_run stage (pr-comments.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        platform:
          - name: "Raspberry Pi"
            id: rpi              # stable slug for the ci-summary-<id> artifact name
            makefile_path: "build/linux/rpi/makefile"
            extra_coverage: "0"
            extra_cflags: ""
          - name: "Banana Pi R4 - MLO"
            id: bpi
            makefile_path: "build/linux/bpi/makefile"
            extra_coverage: "1"
            extra_cflags: "-DCONFIG_GENERIC_MLO"
            clang_tidy: true          # only this leg builds the compile DB + runs clang-tidy
          - name: "Platform Mock Unittests"
            id: mock
            makefile_path: "build/linux/mockplatform/makefile"
            extra_coverage: "0"
            extra_cflags: ""
      fail-fast: false

    name: Build for ${{ matrix.platform.name }}

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        path: 'OneWifi'
        fetch-depth: 0            # clang-tidy diffs changed source against the PR base
        persist-credentials: false   # nothing here pushes; don't leave the token in .git/config

    - name: Clone unified-wifi-mesh repository
      run: |
        mkdir -p easymesh_project
        git clone https://github.com/rdkcentral/unified-wifi-mesh.git easymesh_project/unified-wifi-mesh
        mv OneWifi easymesh_project/OneWifi

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('**/apt-packages') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential \
                                cmake \
                                python3 \
                                python3-pip \
                                git \
                                vim \
                                libev-dev \
                                libjansson-dev \
                                zlib1g-dev \
                                libnl-3-dev \
                                libnl-genl-3-dev \
                                libnl-route-3-dev \
                                libavro-dev \
                                libcjson1 libcjson-dev \
                                libprotobuf-c-dev \
                                libssl-dev \
                                uuid-dev \
                                libmysqlcppconn-dev \
                                libreadline-dev \
                                iptables \
                                mariadb-server \
                                gnupg \
                                file \
                                golang \
                                pkg-config \
                                libperl-dev \
                                libjson-c-dev \
                                libgtest-dev \
                                libgmock-dev \
                                bear \
                                clang-tidy-18

        # Steps for ucode installation required for hostapd compilation
        git clone https://github.com/jow-/ucode.git ucode
        cd ucode
        mkdir build && cd build
        cmake -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF ..
        make -j"$(nproc)"
        sudo make install
        sudo ldconfig

    - name: Setup OneWiFi for ${{ matrix.platform.name }}
      working-directory: easymesh_project/OneWifi
      run: |
        # $GITHUB_ACTOR is a built-in runner env var; use it rather than
        # interpolating ${{ github.actor }} straight into the script.
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global user.name "${GITHUB_ACTOR}"
        make -f ${{ matrix.platform.makefile_path }} setup

    - name: Build OneWiFi for ${{ matrix.platform.name }}
      id: build
      working-directory: easymesh_project/OneWifi
      run: |
        # pipefail so make's exit status (not tee's) decides the step result.
        set -o pipefail
        # clang-tidy leg only: wrap make in `bear` so ONE build yields the objects
        # AND compile_commands.json (no second build). Other legs run make plain.
        ${{ matrix.platform.clang_tidy && 'bear --output compile_commands.json --' || '' }} make -f ${{ matrix.platform.makefile_path }} -j"$(nproc)" all 2>&1 | tee build.log
      env:
        # Coverage tier for the bpi target: "1" enables EXTRA_COV_FLAGS
        # (ONEWIFI_DB_SUPPORT + memwraptool). Ignored by rpi/mockplatform.
        EXTRA_COVERAGE: ${{ matrix.platform.extra_coverage }}
        # Extra defines appended to CFLAGS. bpi appends via 'CFLAGS +=' (so the
        # MLO build picks up -DCONFIG_GENERIC_MLO); rpi/mockplatform use
        # 'CFLAGS =' and ignore it. -j is safe: PROGRAM depends on libwifihal.a.
        CFLAGS: ${{ matrix.platform.extra_cflags }}

    - name: Build summary for ${{ matrix.platform.name }}
      if: always()   # run on failure too, so the red-build reason is surfaced
      working-directory: easymesh_project/OneWifi
      run: |
        # ci-out/ collects the stage-1 artifacts the PR-comment stage posts.
        mkdir -p ci-out
        LOG=build.log
        if [ ! -f "$LOG" ]; then
          echo "## ${{ matrix.platform.name }} — no build log captured" \
            | tee ci-out/build-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Compiler + linker + make errors: what usually explains a red build,
        errs=$(grep -hE ': (error|fatal error):|undefined reference to|Error [0-9]+' "$LOG" \
               | sed -E 's#[^ ]*/(OneWifi|rdk-wifi-hal|rdk-wifi-libhostap)/#\1/#; s#//#/#g' \
               | sort -u || true)
        # Surface the top errors as ANNOTATIONS (the box at the top of the failed
        # check, which people actually check) — not only the run-summary page.
        if [ -n "$errs" ]; then
          printf '%s\n' "$errs" | head -10 | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r l; do echo "::error::$l"; done
        fi
        {
          echo "## ${{ matrix.platform.name }} — build ${{ steps.build.outcome }}"
          if [ -n "$errs" ]; then
            echo "### ❌ Errors ($(printf '%s\n' "$errs" | wc -l) unique)"
            echo '```'
            printf '%s\n' "$errs" | head -100
            echo '```'
          fi
          # Warnings from OneWifi's own sources ONLY, with location.
          # HAL/hostapd/mesh errors still break the build, so will be shown too.
          # OneWifi runs a Yocto-style clean baseline, so anything here
          # is a newly-surfaced bug to triage.
          warns=$(grep -hE ': warning:' "$LOG" \
                  | grep -vE 'rdk-wifi-hal|rdk-wifi-libhostap|unified-wifi-mesh' \
                  | sed -E 's#[^ ]*/OneWifi/+##; s#//#/#g' \
                  | sort -u || true)
          if [ -n "$warns" ]; then
            echo "### ⚠️ OneWifi warnings ($(printf '%s\n' "$warns" | wc -l))"
            echo '```'
            printf '%s\n' "$warns" | head -100
            echo '```'
          else
            echo "### ⚠️ OneWifi warnings: 0"
          fi
        } | tee ci-out/build-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: clang-tidy (advisory) for ${{ matrix.platform.name }}
      if: always() && matrix.platform.clang_tidy
      working-directory: easymesh_project/OneWifi
      run: |
        # Advisory Step 0: NEVER fails the build. List of Checks is in the .clang-tidy.
        # clang-diagnostic-* is filtered-out. Emits separate (from GCC) summary section
        # + ::warning:: annotations, same visibility as the build errors.
        mkdir -p ci-out
        [ -f compile_commands.json ] || { echo "### 🔎 clang-tidy: no compile DB" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
        BASE='${{ github.event.pull_request.base.sha }}'
        CHANGED=''
        if [ -n "$BASE" ]; then
          git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
          CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.c' 2>/dev/null \
                    | grep -vE '^build/|hostap' || true)
        fi
        : > tidy.log
        for f in $CHANGED; do
          [ -f "$f" ] || continue
          # || true: a no-match grep (exit 1) or a tidy hiccup must not abort the loop.
          clang-tidy-18 -p . --quiet "$f" 2>/dev/null \
            | grep -E ': (warning|error):' | grep -v clang-diagnostic >> tidy.log || true
        done
        found=$(sed -E 's#[^ ]*/OneWifi/+##; s#//#/#g' tidy.log | sort -u || true)
        if [ -n "$found" ]; then
          printf '%s\n' "$found" | head -10 | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r l; do echo "::warning::$l"; done
        fi
        {
          if   [ -z "$CHANGED" ]; then echo "### 🔎 clang-tidy: no changed .c to scan"
          elif [ -z "$found" ];   then echo "### 🔎 clang-tidy: clean on changed files"
          else echo "### 🔎 clang-tidy ($(printf '%s\n' "$found" | wc -l) findings)"; echo '```'; printf '%s\n' "$found" | head -100; echo '```'
          fi
        } | tee ci-out/tidy-summary.md >> "$GITHUB_STEP_SUMMARY"

    # ---- Hand-off to the trusted PR-comment stage (pr-comments.yml) ----------
    # Record the PR identity as passive data for the workflow_run poster to
    # validate. Only meaningful on PRs; push builds skip it.
    - name: Record PR metadata for the comment stage
      if: always() && github.event_name == 'pull_request'
      working-directory: easymesh_project/OneWifi
      run: |
        mkdir -p ci-out
        {
          echo "pr_number=${{ github.event.pull_request.number }}"
          echo "head_sha=${{ github.event.pull_request.head.sha }}"
        } > ci-out/pr-meta.env

    # Publish the summary artifact the PR-comment stage posts. Uploaded even on
    # build failure (if: always()) so a red build still gets its summary posted.
    # tidy-summary.md exists on the bpi leg only.
    #
    # scoped to bpi-only FOR NOW: only the Banana Pi leg (coverage + MLO, and the only
    # leg running clang-tidy) is posted as a PR comment. rpi/mock still build and
    # still gate the check. Their respective summaries stay on the action-run 'summary' page
    # ($GITHUB_STEP_SUMMARY), we just don't paste is as comment; There's no infra yet to
    # scope their findings down to the PR's changes, so a comment would be
    # noise nobody acts on. The pr-comments.yml 'build' job already aggregates
    # however many ci-summary-* artifacts exist, so:
    #   TO POST ALL LEGS: delete the `&& matrix.platform.id == 'bpi'` clause below
    #   (nothing to change in pr-comments.yml).
    - name: Upload CI summary artifact
      if: always() && github.event_name == 'pull_request' && matrix.platform.id == 'bpi'
      uses: actions/upload-artifact@v6
      with:
        name: ci-summary-${{ matrix.platform.id }}
        path: easymesh_project/OneWifi/ci-out
        if-no-files-found: warn
        retention-days: 1
