name: Build Check

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Stage 1 is deliberately read-only: it builds PR-controlled makefiles, so it
# must hold no write scope. The PR-comment posting (writes) happens only in the
# trusted workflow_run stage (pr-comments.yml).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        platform:
          - name: "Raspberry Pi"
            id: rpi                   # has to be stable for the ci-summary-<id> stage
            makefile_path: "build/linux/rpi/makefile"
            extra_coverage: "0"
            extra_cflags: ""
          - name: "Banana Pi R4 - MLO"
            id: bpi
            makefile_path: "build/linux/bpi/makefile"
            extra_coverage: "1"
            extra_cflags: "-DCONFIG_GENERIC_MLO"
            clang_tidy: true          # only this leg builds the compile DB + runs clang-tidy
          - name: "Platform Mock Unittests"
            id: mock
            makefile_path: "build/linux/mockplatform/makefile"
            extra_coverage: "0"
            extra_cflags: ""
      fail-fast: false

    name: Build for ${{ matrix.platform.name }}

    steps:
    - name: Checkout current repository
      uses: actions/checkout@v6
      with:
        path: 'OneWifi'
        fetch-depth: 0                # clang-tidy diffs changed source against the PR base
        persist-credentials: false    # nothing here pushes; don't leave the token in .git/config

    - name: Clone unified-wifi-mesh repository
      run: |
        mkdir -p easymesh_project
        git clone https://github.com/rdkcentral/unified-wifi-mesh.git easymesh_project/unified-wifi-mesh
        mv OneWifi easymesh_project/OneWifi

    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential \
                                cmake \
                                python3 \
                                python3-pip \
                                git \
                                vim \
                                libev-dev \
                                libjansson-dev \
                                zlib1g-dev \
                                libnl-3-dev \
                                libnl-genl-3-dev \
                                libnl-route-3-dev \
                                libavro-dev \
                                libcjson1 libcjson-dev \
                                libprotobuf-c-dev \
                                libssl-dev \
                                uuid-dev \
                                libmysqlcppconn-dev \
                                libreadline-dev \
                                iptables \
                                mariadb-server \
                                gnupg \
                                file \
                                golang \
                                pkg-config \
                                libperl-dev \
                                libjson-c-dev \
                                libgtest-dev \
                                libgmock-dev \
                                bear \
                                clang-tidy-18

        # Steps for ucode installation required for hostapd compilation
        git clone https://github.com/jow-/ucode.git ucode
        cd ucode
        # Pin ucode: PR#398 (LibFFI module) merged to master 2026-08-27 and broke the bpi
        # build (ucode's `unused` macro collides with OpenSSL's ossl_unused in HAL TUs).
        # 655ca6d = a0ca7b1^1 = last master BEFORE the FFI merge = last known-good state
        # (it is literally what the last green build cloned). The colliding `unused` macro
        # was added by abb80c6 ON the PR#398 branch, so any commit on that branch -- incl.
        # 19ffa8a, the earlier (wrong) pin -- still ships the poisoned util.h. Use first-
        # parent (a0ca7b1^1), NOT plain `git log`, when moving this pin; bump deliberately.
        git checkout 655ca6d
        mkdir build && cd build
        cmake -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF ..
        make -j"$(nproc)"
        sudo make install
        sudo ldconfig

    # Perf: each device leg (bpi, rpi) clones + patches hostap from upstream
    # (git.w1.fi for rpi, git.w1.fi + GitHub layers for bpi). The patched tree
    # is a pure function of the pins in setup.sh plus the patch inputs, so
    # cache it keyed on those files. On a hit, setup.sh's .hostap_patched flag
    # skips the clone AND patching entirely. A miss falls back to the normal
    # clone, so this can never be slower than today.
    #
    # Exact-key-only (NO restore-keys): a pin bump edits setup.sh -> key
    # changes -> miss -> full re-clone at new pins. restore-keys would
    # resurrect a stale patched tree and silently build the wrong hostap.
    #
    # Each leg has one UNPINNED patch source whose changes must invalidate
    # the cache:
    #   bpi: meta-cmf-bananapi — only the kernel_6_6 patch subdir matters;
    #        the repo gets daily unrelated commits, so we key on the GitHub
    #        API tree SHA of that directory (changes only when a patch file
    #        changes), NOT the whole-repo tip.
    #   rpi: hostap-patches — the entire repo IS patches, so ls-remote tip
    #        is appropriate.
    # mock never clones hostap -> no cache needed.
    - name: Resolve hostap cache key inputs
      if: matrix.platform.id != 'mock'
      id: hostap_key
      run: |
        if [ "${{ matrix.platform.id }}" = "bpi" ]; then
          # meta-cmf-bananapi is a large Yocto layer repo that gets daily
          # commits unrelated to hostap patches. Only one subdirectory
          # matters: the kernel_6_6 patch dir. Query its git tree SHA via
          # the GitHub API — it changes only when an actual patch file is
          # added, removed, renamed, or modified.
          api_url="https://api.github.com/repos/rdkcentral/meta-cmf-bananapi/contents"
          api_url="$api_url/meta-rdk-mtk-bpir4/recipes-ccsp/rdk-wifi-libhostap/files/2.11"
          upstream="$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" "$api_url" \
            | python3 -c "import sys,json; entries=json.load(sys.stdin); print(next(e['sha'] for e in entries if e['name']=='kernel_6_6'))" 2>/dev/null || true)"
        else
          # hostap-patches repo IS the payload — any commit is a patch change.
          upstream="$(git ls-remote https://github.com/rdkcentral/hostap-patches.git HEAD | cut -f1)"
        fi
        if [ -z "$upstream" ]; then
          echo "::warning::Could not resolve upstream patch hash (API/network failure). Cache key falls back to 'unresolved' — a hit may serve a stale tree if patches changed during the outage. Purge with: gh cache delete --all"
        fi
        echo "upstream=${upstream:-unresolved}" >> "$GITHUB_OUTPUT"

        # Hash the setup script + any supplementary patch-list file. rpi's
        # patches are inline in setup.sh; bpi's are in hostap_patch_list.txt.
        setup="easymesh_project/OneWifi/build/linux/${{ matrix.platform.id }}/setup.sh"
        patchlist="easymesh_project/OneWifi/build/openwrt/hostap_patch_list.txt"
        if [ "${{ matrix.platform.id }}" = "bpi" ]; then
          hash="$(cat "$setup" "$patchlist" | sha256sum | cut -c1-16)"
        else
          hash="$(sha256sum < "$setup" | cut -c1-16)"
        fi
        echo "files_hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Cache patched hostap
      if: matrix.platform.id != 'mock'
      uses: actions/cache@v5
      with:
        path: easymesh_project/rdk-wifi-libhostap
        key: hostap-${{ matrix.platform.id }}-${{ steps.hostap_key.outputs.files_hash }}-${{ steps.hostap_key.outputs.upstream }}

    - name: Setup OneWiFi for ${{ matrix.platform.name }}
      working-directory: easymesh_project/OneWifi
      run: |
        # $GITHUB_ACTOR is a built-in runner env var; use it rather than
        # interpolating ${{ github.actor }} straight into the script.
        git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git config --global user.name "${GITHUB_ACTOR}"
        make -f ${{ matrix.platform.makefile_path }} setup

    - name: Build OneWiFi for ${{ matrix.platform.name }}
      id: build
      working-directory: easymesh_project/OneWifi
      run: |
        # pipefail so make's exit status (not tee's) decides the step result.
        set -o pipefail
        # clang-tidy leg only: wrap make in `bear` so ONE build yields the objects
        # AND compile_commands.json (no second build). Other legs run make plain.
        ${{ matrix.platform.clang_tidy && 'bear --output compile_commands.json --' || '' }} make -f ${{ matrix.platform.makefile_path }} -j"$(nproc)" all 2>&1 | tee build.log
      env:
        # Coverage tier for the bpi target: "1" enables EXTRA_COV_FLAGS
        # (ONEWIFI_DB_SUPPORT + memwraptool). Ignored by rpi/mockplatform.
        EXTRA_COVERAGE: ${{ matrix.platform.extra_coverage }}
        # Extra defines appended to CFLAGS. bpi appends via 'CFLAGS +=' (so the
        # MLO build picks up -DCONFIG_GENERIC_MLO); rpi/mockplatform use
        # 'CFLAGS =' and ignore it. -j is safe: PROGRAM depends on libwifihal.a.
        CFLAGS: ${{ matrix.platform.extra_cflags }}

    - name: Build summary for ${{ matrix.platform.name }}
      if: always()   # run on failure too, so the red-build reason is surfaced
      working-directory: easymesh_project/OneWifi
      run: |
        # ci-out/ collects the stage-1 artifacts the PR-comment stage posts.
        mkdir -p ci-out
        LOG=build.log
        if [ ! -f "$LOG" ]; then
          echo "## ${{ matrix.platform.name }} — no build log captured" \
            | tee ci-out/build-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Compiler + linker + make errors: what usually explains a red build,
        errs=$(grep -hE ': (error|fatal error):|undefined reference to|Error [0-9]+' "$LOG" \
               | sed -E 's#[^ ]*/(OneWifi|rdk-wifi-hal|rdk-wifi-libhostap)/#\1/#; s#//#/#g' \
               | sort -u || true)
        # Surface the top errors as ANNOTATIONS (the box at the top of the failed
        # check, which people actually check) — not only the run-summary page.
        if [ -n "$errs" ]; then
          printf '%s\n' "$errs" | head -10 | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r l; do echo "::error::$l"; done
        fi
        {
          echo "## ${{ matrix.platform.name }} — build ${{ steps.build.outcome }}"
          if [ -n "$errs" ]; then
            echo "### ❌ Errors ($(printf '%s\n' "$errs" | wc -l) unique)"
            echo '```'
            printf '%s\n' "$errs" | head -100
            echo '```'
          fi
          # Warnings from OneWifi's own sources ONLY, with location.
          # HAL/hostapd/mesh errors still break the build, so will be shown too.
          # OneWifi runs a Yocto-style clean baseline, so anything here
          # is a newly-surfaced bug to triage.
          warns=$(grep -hE ': warning:' "$LOG" \
                  | grep -vE 'rdk-wifi-hal|rdk-wifi-libhostap|unified-wifi-mesh' \
                  | sed -E 's#[^ ]*/OneWifi/+##; s#//#/#g' \
                  | sort -u || true)
          if [ -n "$warns" ]; then
            echo "### ⚠️ OneWifi warnings ($(printf '%s\n' "$warns" | wc -l))"
            echo '```'
            printf '%s\n' "$warns" | head -100
            echo '```'
          else
            echo "### ⚠️ OneWifi warnings: 0"
          fi
        } | tee ci-out/build-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: clang-tidy (gate + advisory) for ${{ matrix.platform.name }}
      if: always() && matrix.platform.clang_tidy
      working-directory: easymesh_project/OneWifi
      run: |
        # Two-tier clang-tidy over PR-changed .c/.cpp files (see .clang-tidy):
        #   * WarningsAsErrors checks    -> `error:`   -> FATAL (this step fails the job)
        #   * rest of enabled bugprone-* -> `warning:` -> advisory only
        # clang-diagnostic-* (most false positives and most noisy) is filtered out so it can NEVER
        # gate. The gate is changed-files-only: a PR can only fail on a .c/.cpp it touched.
        mkdir -p ci-out
        [ -f compile_commands.json ] || { echo "### 🔎 clang-tidy: no compile DB" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
        BASE='${{ github.event.pull_request.base.sha }}'
        CHANGED=''
        if [ -n "$BASE" ]; then
          git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
          # Changed file not present in compile_commands.json (not built) falls back to default
          # flags. A real source then can't resolve its includes -> a fatal clang-diagnostic
          # aborts file parsing before any check run on it -> that output is dropped by the
          # clang-diagnostic filter below -> file can't fail. Thus, only built files are judged.
          # Exclude only the vendored hostap tree (sibling clone rdk-wifi-libhostap/), never
          # first-party sources: '^build/' wrongly dropped build/linux/compat/coverage_stubs.c
          # (compiled by the makefile, real DB entry) and bare 'hostap' dropped e.g.
          # wifi_hostapd_glue.c. A changed file not in the DB self-skips (default-flags fallback
          # -> fatal clang-diagnostic -> filtered below), so DB membership is the real gate.
          # Anchored '^': git diff paths are repo-relative and the vendored tree, if ever
          # surfaced, sits at the repo root -- so a first-party path that merely *contains*
          # the name (e.g. source/.../rdk-wifi-libhostap-notes.c) is never dropped.
          CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD -- '*.c' '*.cpp' 2>/dev/null \
                    | grep -vE '^rdk-wifi-libhostap/' || true)
        fi
        : > tidy.log
        for f in $CHANGED; do
          [ -f "$f" ] || continue
          # || true: a no-match grep (exit 1) or a clang-tidy hiccup must not abort the loop.
          clang-tidy-18 -p . --quiet "$f" 2>/dev/null \
            | grep -E ': (warning|error):' | grep -v clang-diagnostic >> tidy.log || true
        done
        # WarningsAsErrors-promoted checks print as `error:`; everything else as `warning:`.
        gated=$(grep -E ': error:'   tidy.log | sed -E 's#[^ ]*/OneWifi/+##; s#//#/#g' | sort -u || true)
        advis=$(grep -E ': warning:' tidy.log | sed -E 's#[^ ]*/OneWifi/+##; s#//#/#g' | sort -u || true)
        if [ -n "$gated" ]; then
          printf '%s\n' "$gated" | head -10 | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r l; do echo "::error::$l"; done
        fi
        if [ -n "$advis" ]; then
          printf '%s\n' "$advis" | head -10 | sed 's/%/%25/g; s/\r/%0D/g' \
            | while IFS= read -r l; do echo "::warning::$l"; done
        fi
        {
          if   [ -z "$CHANGED" ];     then echo "### 🔎 clang-tidy: no changed .c to scan"
          elif [ -z "$gated$advis" ]; then echo "### 🔎 clang-tidy: clean on changed files"
          else
            if [ -n "$gated" ]; then
              echo "### ❌ clang-tidy gate — $(printf '%s\n' "$gated" | wc -l) fatal"
              echo '```'; printf '%s\n' "$gated" | head -100; echo '```'
              echo "_Fix the finding, or if it is a deliberate, waive it inline with \`// NOLINT(<check-name>)\` on that line._"
            fi
            if [ -n "$advis" ]; then
              echo "### 🔎 clang-tidy advisory — $(printf '%s\n' "$advis" | wc -l) findings"
              echo '```'; printf '%s\n' "$advis" | head -100; echo '```'
            fi
          fi
        } | tee ci-out/tidy-summary.md >> "$GITHUB_STEP_SUMMARY"
        # Gate AFTER the summary + artifact are written, on promoted checks only.
        if [ -n "$gated" ]; then
          echo "clang-tidy gate: $(printf '%s\n' "$gated" | wc -l) promoted-check violation(s) on changed files" >&2
          exit 1
        fi

    - name: gcc diff-scoped warning gate for ${{ matrix.platform.name }}
      # PROPOSAL (branch ci/gcc-diff-gate). Gate not-yet-promoted gcc classes on the
      # PR's changed LINES only, without promoting them tree-wide (the tree still carries a
      # backlog: -Wvla 18, -Wreturn-type 11, dead-code family). The script recompiles each changed
      # .c/.cpp from compile_commands.json with the candidate warnings enabled (non-fatal) and keeps
      # only findings on lines the PR touched -> a PR can only fail on a class that fires on a changed line.
      # The silent baseline (and the build-summary that relies on it) is unaffected. bpi leg only
      # (it owns the compile DB). Runs AFTER clang-tidy so both gate independently.
      if: always() && matrix.platform.clang_tidy && github.event_name == 'pull_request'
      working-directory: easymesh_project/OneWifi
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        # ROLLOUT: start in advisory mode. ENFORCE=false renders the ❌ "would fail"
        # block but never reds the job, so the mechanism runs on real PRs first.
        # FLIP to 'true' (one-word change) once ALL of these hold on the live runner:
        #   1. >= a handful of real PRs touching .c/.cpp have processed end-to-end
        #      with NO "mechanism error" summary line (the try/except fail-open);
        #   2. >= 1 advisory finding (the -Wunused-* classes fire on ordinary
        #      refactors) hand-checked against the diff -> line attribution correct;
        #   3. zero false positives on the GATE classes.
        # Gate on that evidence, not the calendar. Silence of the GATE classes alone
        # proves nothing (they're rarely introduced) -- the advisory classes are what
        # exercise the recompile + line-scoping machinery.
        ENFORCE: 'false'
        # GATE = fail the job (when ENFORCE=true) if introduced on a changed line.
        # ADVISORY = report only. -Wvla (stack-overflow) + -Wreturn-type (UB) are
        # high-impact + reliable -> first to gate. The dead-code family is
        # diff-scope-reliable but kept ADVISORY (promote a class into GATE_WARNINGS
        # once quiet on real PRs). (-Wunreachable-code-* are clang-only; the "moved
        # code left set-but-unused vars" case is -Wunused-but-set-variable.)
        GATE_WARNINGS: "-Wvla -Wreturn-type"
        ADVISORY_WARNINGS: "-Wunused-but-set-variable -Wunused-value -Wunused-label"
      run: |
        set -uo pipefail
        mkdir -p ci-out
        if [ ! -f compile_commands.json ] || [ -z "$BASE" ]; then
          echo "### 🚦 gcc diff-gate: no compile DB or PR base — skipped" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
        # The script prints a markdown summary to stdout and ::error::/::warning:: to stderr;
        # it exits 1 iff a GATE class fired on a changed line.
        # A missing script (partial cherry-pick / not yet on this branch) must skip,
        # not red the job: python3 on an absent file exits 2 and would fail the matrix.
        if [ ! -f .github/scripts/gcc_diff_gate.py ]; then
          echo "### 🚦 gcc diff-gate: script not present — skipped" | tee -a ci-out/gcc-gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        set +e
        python3 .github/scripts/gcc_diff_gate.py > gcc-gate.md
        rc=$?
        set -e
        tee -a ci-out/gcc-gate-summary.md < gcc-gate.md >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

    # ---- Hand-off to the trusted PR-comment stage (pr-comments.yml) ----------
    # Record the PR identity as passive data for the workflow_run poster to
    # validate. Only meaningful on PRs; push builds skip it.
    - name: Record PR metadata for the comment stage
      if: always() && github.event_name == 'pull_request'
      working-directory: easymesh_project/OneWifi
      run: |
        mkdir -p ci-out
        {
          echo "pr_number=${{ github.event.pull_request.number }}"
          echo "head_sha=${{ github.event.pull_request.head.sha }}"
        } > ci-out/pr-meta.env

    # Publish the summary artifact the PR-comment stage posts. Uploaded even on build failure
    # (if: always()) so a red build still gets its summary posted. tidy-summary.md for now
    # exists only on the bananapi build leg.
    #
    # Scoped to the two device legs (bpi + rpi), NOT mock. Both devices run the Yocto-style
    # clean baseline (-Wall -Wextra + explicit -Wno-), so their build-summaries are silent
    # *UNLESS* a genuinely new warning *class* appears.
    # NOTE: the build-summary greps the whole list of OneWifi warnings — it is NOT PR-diff-scoped
    # (unlike the clang-tidy step). It relies on that silent baseline, so any un-suppressed
    # residual warning would show on every PR. mock is the unittest leg (no clean-baseline gate)
    # -> excluded to avoid exactly that noise.
    # The pr-comments.yml 'build' job aggregates however many ci-summary-* exist
    # (and anchors trust on ci-summary-bpi, so bpi must always upload), so:
    #   TO ADD mock:     drop the `&& matrix.platform.id != 'mock'` clause below.
    #   TO REVERT to bpi-only: change it back to `== 'bpi'`.
    #   (nothing to change in pr-comments.yml either way.)
    - name: Upload CI summary artifact
      if: always() && github.event_name == 'pull_request' && matrix.platform.id != 'mock'
      uses: actions/upload-artifact@v6
      with:
        name: ci-summary-${{ matrix.platform.id }}
        path: easymesh_project/OneWifi/ci-out
        if-no-files-found: warn
        retention-days: 1
